    overscroll-behavior:none;
    display:flex;align-items:center;justify-content:center;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
    background-image:
      radial-gradient(circle,#fff 0 1px,transparent 1.2px),
      radial-gradient(circle,var(--cyan) 0 1px,transparent 1.2px);
    background-size:78px 78px,116px 116px;
    background-position:12px 18px,48px 52px;
    mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 82%);
  }
  #wrap{
    position:relative;
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
  }
  #wrap::before{display:none;}
  #stage{
    position:relative;
    line-height:0;
    border-radius:8px;
    overflow:hidden;
    isolation:isolate;
    background:#000;
    box-shadow:0 0 0 2px #2a1f14, 0 12px 40px rgba(0,0,0,.5);
  }
  #stage::after{display:none;}
  /* 世界层：低分辨率 + 最近邻放大，保持像素锐利 */
  #screen{
    display:block;
    image-rendering:pixelated;
    image-rendering:-moz-crisp-edges;
    image-rendering:crisp-edges;
    background:#000;
    touch-action:none;
  }
  /* 扫描线只盖世界层，不糊 UI 文字。
     注意必须显式铺满：#scan 是绝对定位且没有内容，
     不给 right/bottom 的话会收缩成 0×0，等于从来没显示过。 */
  #scan{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.13) 0 1px,rgba(0,0,0,0) 1px 3px);
    mix-blend-mode:multiply;opacity:.38;
  }
  /* UI 层：原生分辨率，文字与图标清晰 */
  #ui{
    position:absolute;left:0;top:0;z-index:3;
    pointer-events:none;
    background:transparent;
  }
  /* 桌面端底部操作提示 */
  #hint{
    position:fixed;left:50%;bottom:10px;z-index:10;
    display:flex;align-items:center;justify-content:center;gap:12px;
    max-width:calc(100vw - 28px);padding:7px 12px;
    transform:translateX(-50%);white-space:nowrap;
    border:1px solid rgba(255,255,255,.09);border-radius:999px;
    background:rgba(12,8,24,.72);box-shadow:0 8px 28px rgba(0,0,0,.25);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    color:var(--muted);font-size:10px;letter-spacing:.03em;
    pointer-events:none;user-select:none;
  }
  #hint span{display:inline-flex;align-items:center;gap:5px;}
  #hint kbd{
    min-width:20px;padding:3px 5px;border:1px solid rgba(255,255,255,.16);border-bottom-color:rgba(255,255,255,.3);
    border-radius:5px;background:rgba(255,255,255,.07);color:#eee8ff;
    font:700 9px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;text-align:center;
    box-shadow:inset 0 -1px rgba(255,255,255,.06);
  }
  #hint .rewind{color:var(--cyan);}
  #hint .rewind kbd{border-color:rgba(124,245,255,.36);background:rgba(124,245,255,.1);color:var(--cyan);}
  body.touch #hint{display:none;}
  @media (max-width:900px),(max-height:620px){
    #wrap::before{display:none;}
    #hint{gap:7px;padding:6px 9px;}
    #hint .optional{display:none;}
  }

  /* 移动端虚拟按键（横屏时贴在左右下角） */
  #touch{
    position:fixed;inset:auto 0 0 0;
    display:none;
    justify-content:space-between;
    align-items:flex-end;
    padding:0 16px calc(12px + env(safe-area-inset-bottom)) 16px;
    pointer-events:none;
    z-index:20;
  }
  #touch .pad{display:flex;align-items:flex-end;gap:12px;pointer-events:auto;}
  #touch button{
    width:58px;height:58px;border-radius:18px;
    border:1px solid rgba(255,255,255,.34);
    background:linear-gradient(145deg,rgba(70,50,112,.78),rgba(25,16,48,.82));
    color:#fff;font-size:17px;font-weight:800;
    box-shadow:inset 0 1px rgba(255,255,255,.16),0 8px 22px rgba(0,0,0,.28);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    user-select:none;-webkit-user-select:none;
    -webkit-touch-callout:none;touch-action:none;
    padding:0;margin:0;-webkit-appearance:none;appearance:none;
    transition:transform .08s ease,background .08s ease;
  }
  #touch button:active,#touch button.on{background:linear-gradient(145deg,#9a83ff,#6545d2);transform:translateY(2px) scale(.94);}
  /* 星辰回溯键：单独一个冷色，跟跳跃区分开 */
  #touch button.rw{
    width:50px;height:50px;font-size:13px;letter-spacing:-.04em;
    border-color:rgba(124,245,255,.55);
    background:rgba(16,64,88,.72);
    color:#9ff8ff;
  }
  #touch button.rw:active,#touch button.rw.on{background:rgba(70,200,235,.85);color:#04141c;}
  body.touch #touch{display:flex;}

  /* 竖屏遮罩：请旋转设备 */
  #rotate{
    position:fixed;inset:0;z-index:60;
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    gap:18px;text-align:center;padding:24px;
    background:linear-gradient(180deg,#150e28,#0b0716);
  }
  body.need-rotate #rotate{display:flex;}
  body.need-rotate #stage,
  body.need-rotate #touch,
  body.need-rotate #hint{display:none !important;}
  #rotate .phone{
    width:64px;height:104px;border:3px solid #7a6fa8;border-radius:12px;
    position:relative;animation:rot 1.8s ease-in-out infinite;
  }
  #rotate .phone::after{
    content:"";position:absolute;left:50%;bottom:6px;width:18px;height:3px;
    background:#7a6fa8;border-radius:2px;transform:translateX(-50%);
  }
  @keyframes rot{
    0%,35%{transform:rotate(0deg);}
    60%,100%{transform:rotate(-90deg);}
  }
  #rotate h2{margin:0;font-size:17px;color:#ffe066;letter-spacing:.05em;}
  #rotate p{margin:0;font-size:12px;color:#8d80b8;line-height:1.7;}
</style>
